default:
  image: node:20

stages:
  - deploy

cache:
  paths:
    - node_modules/
    
before_script:
  - corepack enable
  - corepack prepare pnpm@10.2.0 --activate
  - npm install --global vercel
  - vercel --version

deploy_preview:
  stage: deploy
  except:
    - main
  script:
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN
